<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <text x="60" y="42" font-size="24" font-weight="bold" fill="#24292f">GitHub Actions 탭에서 실행 결과를 확인한다</text>
  <text x="60" y="72" font-size="16" fill="#57606a">초록 체크면 통과, 빨간 X면 실패. 실패한 단계를 클릭하면 로그가 펼쳐진다</text>

  <!-- 카드 -->
  <rect x="60" y="100" width="780" height="480" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="90" y="145" font-size="26" font-weight="bold" fill="#24292f">Actions</text>
  <text x="90" y="172" font-size="14" fill="#57606a">Workflow runs · main branch</text>
  <line x1="60" y1="190" x2="840" y2="190" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- 행 1: 성공 -->
  <rect x="75" y="205" width="750" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="75" y="205" width="6" height="72" rx="3" fill="#1a7f37"/>
  <circle cx="108" cy="241" r="15" fill="#1a7f37"/>
  <path d="M102 241 l4 5 l8 -9" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="233" font-size="16" font-weight="bold" fill="#24292f">#23 · CI</text>
  <text x="140" y="257" font-size="13" fill="#57606a">main branch · 2분 전</text>
  <text x="795" y="233" font-size="16" font-weight="bold" fill="#1a7f37" text-anchor="end">성공 ✓</text>
  <text x="795" y="257" font-size="13" fill="#57606a" text-anchor="end">21초</text>

  <!-- 행 2: 실패 -->
  <rect x="75" y="297" width="750" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="75" y="297" width="6" height="72" rx="3" fill="#cf222e"/>
  <circle cx="108" cy="333" r="15" fill="#cf222e"/>
  <path d="M102 327 l12 12 M114 327 l-12 12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="140" y="325" font-size="16" font-weight="bold" fill="#24292f">#22 · CI</text>
  <text x="140" y="349" font-size="13" fill="#57606a">main branch · 1시간 전</text>
  <text x="795" y="325" font-size="16" font-weight="bold" fill="#cf222e" text-anchor="end">실패 ✗</text>
  <text x="795" y="349" font-size="13" fill="#57606a" text-anchor="end">18초</text>

  <!-- 실패 지점 펼침 -->
  <rect x="75" y="389" width="750" height="170" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="105" y="420" font-size="15" font-weight="bold" fill="#24292f">어떤 단계에서 실패했을까?</text>

  <!-- 스텝들 -->
  <circle cx="115" cy="452" r="9" fill="#1a7f37"/>
  <path d="M111 452 l3 3 l5 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="456" font-size="14" fill="#24292f">actions/checkout — 코드 받아오기</text>

  <circle cx="115" cy="480" r="9" fill="#1a7f37"/>
  <path d="M111 480 l3 3 l5 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="484" font-size="14" fill="#24292f">pnpm/action-setup — pnpm 설치</text>

  <circle cx="115" cy="508" r="9" fill="#1a7f37"/>
  <path d="M111 508 l3 3 l5 -6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="138" y="512" font-size="14" fill="#24292f">setup-node + pnpm install — 의존성 설치</text>

  <circle cx="115" cy="536" r="9" fill="#cf222e"/>
  <path d="M111 531 l8 8 M119 531 l-8 8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="138" y="540" font-size="14" font-weight="bold" fill="#cf222e">pnpm lint — 여기서 실패!</text>

  <circle cx="115" cy="564" r="9" fill="#d0d7de"/>
  <path d="M109 564 h12" stroke="#57606a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="138" y="568" font-size="14" fill="#57606a">pnpm test — 실패로 멈춰서 실행 안 됨</text>
</svg>
