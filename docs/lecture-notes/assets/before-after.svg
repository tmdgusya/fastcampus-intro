<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="400" viewBox="0 0 1160 400" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="mid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <rect width="1160" height="400" fill="#ffffff"/>
  <text x="40" y="42" font-size="24" font-weight="bold" fill="#24292f">CI가 있으면 개발 흐름이 이렇게 달라진다</text>
  <text x="40" y="72" font-size="16" fill="#57606a">매번 손으로 하던 검사를, push 한 번으로</text>

  <!-- 왼쪽: 수동 -->
  <rect x="40" y="100" width="500" height="260" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="2"/>
  <text x="290" y="140" font-size="20" font-weight="bold" fill="#9a6700" text-anchor="middle">CI가 없던 때 (매번 수동으로)</text>
  <g font-size="16" fill="#57606a">
    <text x="80" y="184">1. 코드를 고친다</text>
    <text x="80" y="222">2. 직접 pnpm lint 실행</text>
    <text x="80" y="260">3. 직접 pnpm test 실행</text>
    <text x="80" y="298">4. 깜빡하거나 건너뛰기 쉬움 😅</text>
  </g>

  <!-- 중앙 화살표 -->
  <path d="M548 230 L610 230" stroke="#0969da" stroke-width="5" fill="none" marker-end="url(#mid-arrow)"/>

  <!-- 오른쪽: 자동 -->
  <rect x="620" y="100" width="500" height="260" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="870" y="140" font-size="20" font-weight="bold" fill="#1a7f37" text-anchor="middle">CI가 있을 때 (push하면 자동)</text>
  <g font-size="16" fill="#1a7f37">
    <text x="660" y="184">1. 코드를 고치고 push만 한다</text>
    <text x="660" y="222">2. GitHub이 알아서 린트·테스트 실행</text>
    <text x="660" y="260">3. 실패하면 뱃지·알림으로 표시</text>
    <text x="660" y="298">4. 건너뛸 일이 없음 ✅</text>
  </g>
</svg>
